[package]
name = "blog-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "blog-backend"

[lib]
name = "blog_backend"
path = "src/lib.rs"

[[bin]]
name = "blog-backend"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "schema-fingerprint"
path = "src/bin/schema_fingerprint.rs"

[[bin]]
name = "stamp-diesel-migrations"
path = "src/bin/stamp_diesel_migrations.rs"

[[bin]]
name = "external-fixtures"
path = "src/bin/external_fixtures.rs"

[dependencies]
anyhow = "=1.0.102"
async-trait = "=0.1.89"
aws-config = { version = "=1.8.18", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
axum = { version = "=0.8.9", features = ["json", "macros", "multipart", "ws"] }
base64 = "=0.22.1"
bcrypt = "=0.19.3"
chrono = { version = "=0.4.42", features = ["serde"] }
clap = { version = "=4.5.60", features = ["derive", "env"] }
diesel = { version = "=2.3.11", features = ["chrono", "postgres", "serde_json", "uuid"] }
diesel-async = { version = "=0.9.2", features = ["deadpool", "postgres"] }
diesel_migrations = "=2.3.1"
dotenvy = "=0.15.7"
email_address = "=0.2.9"
futures-util = "=0.3.32"
hex = "=0.4.3"
http = "=1.4.0"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["service", "tokio"] }
jsonwebtoken = { version = "=11.0.0", features = ["rust_crypto"] }
pdf-extract = "=0.12.0"
pgvector = { version = "=0.4.2", features = ["diesel"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
scraper = "=0.27.0"
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "json"] }
utoipa = { version = "=5.5.0", features = ["chrono", "preserve_order", "uuid"] }
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum", "vendored"] }
uuid = { version = "=1.18.1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tokio-tungstenite = "=0.29.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.test]
debug = 0
