# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

services:
  - type: web
    name: blog-backend
    runtime: docker
    plan: starter
    # Oregon is Render's closest region to the existing Fly SJC deployment.
    # Confirm the Supabase region before the first Blueprint sync because this
    # value cannot be changed after service creation.
    region: oregon
    repo: https://github.com/kevingil/blog
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    preDeployCommand: /usr/local/bin/migrate
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    numInstances: 1
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
        - render.yaml
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_ACCESS_KEY_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_URL_PREFIX
        sync: false
