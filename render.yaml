# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: "off"

services:
  - type: web
    name: blog-backend
    runtime: rust
    # HEIC conversion needs libheif >= 1.18. This image has neither heif-convert
    # nor a HEIF-capable ImageMagick, and its root filesystem is read-only.
    # The build downloads bookworm-backports packages into backend/opt/heif.
    plan: starter
    # Oregon is Render's closest region to the existing Fly SJC deployment.
    # Confirm the Supabase region before the first Blueprint sync because this
    # value cannot be changed after service creation.
    region: oregon
    repo: https://github.com/kevingil/blog
    branch: main
    buildCommand: >-
      bash scripts/vendor-heif.sh
      && cargo build --manifest-path backend/Cargo.toml --locked --release
      --target-dir backend/target
      --bin blog-backend --bin migrate --bin stamp-diesel-migrations
      --bin schema-fingerprint
    startCommand: ./backend/target/release/blog-backend
    autoDeployTrigger: checksPass
    preDeployCommand: ./scripts/pre-deploy.sh backend/target/release
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    numInstances: 1
    buildFilter:
      paths:
        - backend/**
        - scripts/pre-deploy.sh
        - scripts/install-heif.sh
        - scripts/vendor-heif.sh
        - render.yaml
    envVars:
      - key: RUSTUP_TOOLCHAIN
        value: "1.92.0"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_ACCESS_KEY_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_URL_PREFIX
        sync: false
